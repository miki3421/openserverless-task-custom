version: "3"

vars:
  D: ""
  RUN: '{{if eq .D ""}}{{else}}echo{{end}}'
  CAT: '{{if eq .D ""}}true{{else}}cat{{end}}'
  OS: "{{OS}}"
  ARCH: "{{ARCH}}"

env:
  KUBECONFIG:
    sh: |
      if test -n "$KUBECONFIG"
      then printf '%s\n' "$KUBECONFIG"
      elif test -e "$OPS_TMP/kubeconfig"
      then printf '%s\n' "$OPS_TMP/kubeconfig"
      else echo ~/.kube/config
      fi

tasks:

  backup-pack:
    desc: encrypt a verified native backup and validate a fresh archive restore
    silent: true
    env:
      OPS_UPDATE_REQUEST: >-
        {"inventory":{{toJson (default "" .__inventory)}},"backupPlan":{{toJson (default "" .__backup_plan)}},"artifacts":{{toJson (default "" .__artifacts)}},"archive":{{toJson (default "" .__archive)}},"workspace":{{toJson (default "" .__workspace)}},"password":{{toJson (default "" .__password_file)}},"tools":{{toJson (default "" .__tools)}},"json":{{toJson (default false .__json)}}}
    cmds:
      - bun archive.ts

  backup-unpack:
    desc: decrypt and verify a backup without connecting to the source cluster
    silent: true
    env:
      OPS_UPDATE_REQUEST: >-
        {"unpack":true,"archive":{{toJson (default "" .__archive)}},"workspace":{{toJson (default "" .__workspace)}},"password":{{toJson (default "" .__password_file)}},"tools":{{toJson (default "" .__tools)}},"json":{{toJson (default false .__json)}}}
    cmds:
      - bun archive.ts

  backup-plan:
    desc: map every inventoried backend and PVC to the pinned native backup procedure without collecting data
    silent: true
    env:
      OPS_UPDATE_REQUEST: >-
        {"inventory":{{toJson (default "" .__inventory)}},"json":{{toJson (default false .__json)}}}
    cmds:
      - bun backup.ts

  backup-collect:
    desc: collect one explicitly selected native backup component into a fresh private directory
    silent: true
    env:
      OPS_UPDATE_REQUEST: >-
        {"inventory":{{toJson (default "" .__inventory)}},"component":{{toJson (default "" .__component)}},"artifacts":{{toJson (default "" .__artifacts)}},"tools":{{toJson (default "" .__tools)}},"json":{{toJson (default false .__json)}}}
    cmds:
      - bun native.ts

  backup-verify:
    desc: verify native backup artifact integrity and declared inventory coverage without restoring data
    silent: true
    env:
      OPS_UPDATE_REQUEST: >-
        {"verify":true,"inventory":{{toJson (default "" .__inventory)}},"receipt":{{toJson (default "" .__receipt)}},"artifacts":{{toJson (default "" .__artifacts)}},"json":{{toJson (default false .__json)}}}
    cmds:
      - bun backup.ts

  backup-assemble:
    desc: assemble complete inventory-bound component receipts and verify every private artifact
    silent: true
    env:
      OPS_UPDATE_REQUEST: >-
        {"assemble":true,"inventory":{{toJson (default "" .__inventory)}},"artifacts":{{toJson (default "" .__artifacts)}},"json":{{toJson (default false .__json)}}}
    cmds:
      - bun backup.ts

  inventory:
    desc: inventory all source namespaces and application resources without changing the cluster
    silent: true
    env:
      OPS_UPDATE_REQUEST: >-
        {"namespace":{{toJson (default "" .__namespace)}},"instance":{{toJson (default "controller" .__instance)}},"context":{{toJson (default "" .__context)}},"json":{{toJson (default false .__json)}}}
    cmds:
      - bun migration.ts

  default:
    desc: inspect a release or plan an update without changing the cluster
    silent: true
    env:
      OPS_UPDATE_REQUEST: >-
        {"check":{{toJson (default false .__check)}},"plan":{{toJson (default false .__plan)}},"json":{{toJson (default false .__json)}},"manifest":{{toJson (default "" .__manifest)}},"index":{{toJson (default "" .__index)}},"to":{{toJson (default "" .__to)}},"channel":{{toJson (default "stable" .__channel)}},"context":{{toJson (default "" .__context)}},"namespace":{{toJson (default "openserverless" .__namespace)}},"instance":{{toJson (default "controller" .__instance)}}}
    cmds:
      - bun plan.ts

  cli:
    desc: update the cli
    silent: true
    cmds:
      - $OPS -update

  secrets:
    silent: true
    desc: retrieve secrets from the kubernetes cluster
    cmds:
      - echo "Retrieving secrets..."
      - config SECRET_OPENWHISK_SYSTEM="$(kubectl -n openserverless get wsk/controller -o jsonpath='{.spec.openwhisk.namespaces.whisk-system}')"
      - config SECRET_OPENWHISK_OPENSERVERLESS="$(kubectl -n openserverless get wsk/controller -o jsonpath='{.spec.openwhisk.namespaces.openserverless}')"
      - config SECRET_COUCHDB_ADMIN="$(kubectl -n openserverless get wsk/controller -o jsonpath='{.spec.couchdb.admin.password}')"
      - config SECRET_COUCHDB_INVOKER="$(kubectl -n openserverless get wsk/controller -o jsonpath='{.spec.couchdb.controller.password}')"
      - config SECRET_COUCHDB_CONTROLLER="$(kubectl -n openserverless get wsk/controller -o jsonpath='{.spec.couchdb.invoker.password}')"
      - config SECRET_REDIS_DEFAULT="$(kubectl -n openserverless get wsk/controller -o jsonpath='{.spec.redis.default.password}')"
      - config SECRET_REDIS_OPENSERVERLESS="$(kubectl -n openserverless get wsk/controller -o jsonpath='{.spec.redis.openserverless.password}')"
      - config SECRET_MONGODB_ADMIN="$(kubectl -n openserverless get wsk/controller -o jsonpath='{.spec.mongodb.admin.password}')"
      - config SECRET_MONGODB_OPENSERVERLESS="$(kubectl -n openserverless get wsk/controller -o jsonpath='{.spec.mongodb.openserverless.password}')"
      - config SECRET_SEAWEEDFS_OPENSERVERLESS="$(kubectl -n openserverless get wsk/controller -o jsonpath='{.spec.seaweedfs.openserverless.password}')"
      - config SECRET_POSTGRES_ADMIN="$(kubectl -n openserverless get wsk/controller -o jsonpath='{.spec.postgres.admin.password}')"
      - config SECRET_POSTGRES_REPLICA="$(kubectl -n openserverless get wsk/controller -o jsonpath='{.spec.postgres.admin.replica-password}')"
      - config SECRET_POSTGRES_OPENSERVERLESS="$(kubectl -n openserverless get wsk/controller -ojsonpath='{.spec.postgres.openserverless.password}')"
      - config SECRET_OPENSERVERLESS_METADATA="$(kubectl -n openserverless get wsk/controller -ojsonpath='{.spec.openserverless.password}')"
      - config SECRET_MILVUS_ROOT="$(kubectl -n openserverless get wsk/controller -ojsonpath='{.spec.milvus.password.root}')"
      - config SECRET_MILVUS_S3="$(kubectl -n openserverless get wsk/controller -ojsonpath='{.spec.milvus.password.s3}')"
      - config REGISTRY_CONFIG_SECRET_PUSH_PULL="$(kubectl -n openserverless get wsk/controller -ojsonpath='{.spec.registry.auth.password}')"

  apply:
    desc: apply updated config
    cmds:
      - $OPS update secrets
      - $OPS setup kubernetes runtimes
      - $OPS setup kubernetes instance
      - $OPS setup kubernetes wait-services
      - $OPS setup openserverless login

  operator:
    desc: deploys latest version of operator
    cmds:
      - $OPS setup kubernetes operator-update

  runtimes:
    desc: deploys latest version of runtimes
    cmds:
      - $OPS setup kubernetes runtimes
